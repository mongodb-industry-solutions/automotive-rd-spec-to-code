apiVersion: v1
kind: Namespace
metadata:
  name: workflows
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo
  namespace: workflows
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-server
  namespace: workflows
---
# Cluster-wide role for Argo Server UI to query workflows and templates across namespaces without 403 errors
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-server-cluster-role
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workflowtemplates
      - clusterworkflowtemplates
      - cronworkflows
      - clusterworkflowtemplates/finalizers
      - workfloweventbindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-server-cluster-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-server-cluster-role
subjects:
  - kind: ServiceAccount
    name: argo-server
    namespace: workflows
  - kind: ServiceAccount
    name: argo
    namespace: workflows
---
# ClusterRoleBinding granting controller execution permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-binding
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: workflows
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
# Default namespace fallback role to ensure web UI queries to default namespace succeed seamlessly
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-server-role
  namespace: default
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-server-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-server-role
subjects:
  - kind: ServiceAccount
    name: argo-server
    namespace: workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-server
  namespace: workflows
spec:
  selector:
    matchLabels:
      app: argo-server
  template:
    metadata:
      labels:
        app: argo-server
    spec:
      serviceAccountName: argo-server
      containers:
        - name: argo-server
          image: quay.io/argoproj/argocli:v3.5.5
          args: ["server", "--namespaced", "--secure=false", "--auth-mode=server"]
          ports:
            - containerPort: 2746
---
apiVersion: v1
kind: Service
metadata:
  name: argo-server
  namespace: workflows
spec:
  ports:
    - port: 2746
      targetPort: 2746
  selector:
    app: argo-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-repositories
  namespace: workflows
  annotations:
    workflows.argoproj.io/default-artifact-repository: default-v1
data:
  default-v1: |
    archiveLogs: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: workflows
data:
  artifactRepository: |
    archiveLogs: false


